<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кубик удачи 🎲</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d14;
            --accent: #c7a0ff;
            --glow: #a855f7;
            --sz: 160px;
            --half: 80px;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Unbounded', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ── STARS ── */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: var(--oa, .1);
                transform: scale(1);
            }

            to {
                opacity: var(--ob, .7);
                transform: scale(1.5);
            }
        }

        /* ── FLASH ── */
        #flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 300;
        }

        /* ── SCENE WRAP ── */
        .scene-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .title {
            color: var(--accent);
            font-size: clamp(.95rem, 2.5vw, 1.4rem);
            letter-spacing: .1em;
            text-transform: uppercase;
            text-shadow: 0 0 22px var(--glow);
        }

        .title.landed {
            color: #fff;
            font-size: clamp(1.15rem, 3.5vw, 1.8rem);
            text-shadow: 0 0 30px var(--glow), 0 0 60px #6d28d9;
        }

        /* ── 3-D CUBE ── */
        .scene {
            width: var(--sz);
            height: var(--sz);
            perspective: 650px;
            perspective-origin: 50% 40%;
            cursor: pointer;
        }

        .cube {
            width: var(--sz);
            height: var(--sz);
            position: relative;
            transform-style: preserve-3d;
        }

        /* idle gentle float */
        .cube.idle {
            animation: cubeIdle 4s ease-in-out infinite;
        }

        @keyframes cubeIdle {
            0% {
                transform: rotateX(18deg) rotateY(-20deg) translateY(0px);
            }

            50% {
                transform: rotateX(18deg) rotateY(20deg) translateY(-8px);
            }

            100% {
                transform: rotateX(18deg) rotateY(-20deg) translateY(0px);
            }
        }

        /* hover glow on scene */
        .scene:hover .cube.idle {
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, .8));
        }

        .scene:hover .cube.idle .face {
            border-color: rgba(200, 150, 255, .9);
        }

        .face {
            position: absolute;
            width: var(--sz);
            height: var(--sz);
            background: linear-gradient(145deg, #1e0a4a 0%, #090318 100%);
            border: 2.5px solid rgba(168, 85, 247, .6);
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(168, 85, 247, .18), 0 0 28px rgba(168, 85, 247, .28);
            transition: border-color .3s;
        }

        .face.front {
            transform: rotateY(0deg) translateZ(var(--half));
        }

        .face.back {
            transform: rotateY(180deg) translateZ(var(--half));
        }

        .face.right {
            transform: rotateY(90deg) translateZ(var(--half));
        }

        .face.left {
            transform: rotateY(-90deg) translateZ(var(--half));
        }

        .face.top {
            transform: rotateX(90deg) translateZ(var(--half));
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(var(--half));
        }

        .dot {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #e8d0ff, #a855f7);
            box-shadow: 0 0 8px #a855f7, 0 0 20px rgba(168, 85, 247, .7);
        }

        /* FACE 1 front */
        .face.front .dot:nth-child(1) {
            top: 68px;
            left: 68px;
        }

        /* FACE 6 back  */
        .face.back .dot:nth-child(1) {
            top: 24px;
            left: 24px;
        }

        .face.back .dot:nth-child(2) {
            top: 24px;
            left: 116px;
        }

        .face.back .dot:nth-child(3) {
            top: 68px;
            left: 24px;
        }

        .face.back .dot:nth-child(4) {
            top: 68px;
            left: 116px;
        }

        .face.back .dot:nth-child(5) {
            top: 112px;
            left: 24px;
        }

        .face.back .dot:nth-child(6) {
            top: 112px;
            left: 116px;
        }

        /* FACE 3 right */
        .face.right .dot:nth-child(1) {
            top: 24px;
            left: 112px;
        }

        .face.right .dot:nth-child(2) {
            top: 68px;
            left: 68px;
        }

        .face.right .dot:nth-child(3) {
            top: 112px;
            left: 24px;
        }

        /* FACE 4 left  */
        .face.left .dot:nth-child(1) {
            top: 24px;
            left: 24px;
        }

        .face.left .dot:nth-child(2) {
            top: 24px;
            left: 112px;
        }

        .face.left .dot:nth-child(3) {
            top: 112px;
            left: 24px;
        }

        .face.left .dot:nth-child(4) {
            top: 112px;
            left: 112px;
        }

        /* FACE 5 top   */
        .face.top .dot:nth-child(1) {
            top: 24px;
            left: 24px;
        }

        .face.top .dot:nth-child(2) {
            top: 24px;
            left: 112px;
        }

        .face.top .dot:nth-child(3) {
            top: 68px;
            left: 68px;
        }

        .face.top .dot:nth-child(4) {
            top: 112px;
            left: 24px;
        }

        .face.top .dot:nth-child(5) {
            top: 112px;
            left: 112px;
        }

        /* FACE 2 bottom*/
        .face.bottom .dot:nth-child(1) {
            top: 24px;
            left: 24px;
        }

        .face.bottom .dot:nth-child(2) {
            top: 112px;
            left: 112px;
        }

        #cubeShadow {
            width: 130px;
            height: 18px;
            background: radial-gradient(ellipse, rgba(168, 85, 247, .4) 0%, transparent 70%);
            border-radius: 50%;
            margin-top: -6px;
            transition: opacity .3s;
        }

        .hint {
            color: rgba(199, 160, 255, .35);
            font-size: .6rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            transition: opacity .5s;
        }

        /* ── SECRET CODE INPUT ── */
        .secret-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: clamp(260px, 55vw, 360px);
            margin-top: 8px;
        }

        /* glitch label */
        .glitch-label-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glitch-label {
            position: relative;
            color: rgba(168, 85, 247, .8);
            font-size: .6rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            animation: labelFlicker 5s infinite;
        }

        .glitch-label::before,
        .glitch-label::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
        }

        .glitch-label::before {
            color: #f43f5e;
            animation: glitchBefore 5s infinite;
        }

        .glitch-label::after {
            color: #38bdf8;
            animation: glitchAfter 5s infinite;
        }

        @keyframes labelFlicker {

            0%,
            82%,
            84%,
            86%,
            100% {
                opacity: 1;
            }

            83%,
            85% {
                opacity: .4;
            }
        }

        @keyframes glitchBefore {

            0%,
            85%,
            100% {
                clip-path: inset(0 0 100% 0);
                transform: translate(0);
            }

            86% {
                clip-path: inset(20% 0 50% 0);
                transform: translate(-4px, 1px);
            }

            88% {
                clip-path: inset(60% 0 10% 0);
                transform: translate(3px, -1px);
            }

            90% {
                clip-path: inset(0 0 100% 0);
            }
        }

        @keyframes glitchAfter {

            0%,
            87%,
            100% {
                clip-path: inset(0 0 100% 0);
                transform: translate(0);
            }

            88% {
                clip-path: inset(50% 0 20% 0);
                transform: translate(4px, 0px);
            }

            90% {
                clip-path: inset(10% 0 70% 0);
                transform: translate(-3px, 1px);
            }

            92% {
                clip-path: inset(0 0 100% 0);
            }
        }

        .lock-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(168, 85, 247, .7);
            box-shadow: 0 0 8px rgba(168, 85, 247, .8);
            flex-shrink: 0;
            animation: dotBlink 2.5s ease-in-out infinite alternate;
        }

        @keyframes dotBlink {
            from {
                opacity: .3;
            }

            to {
                opacity: 1;
            }
        }

        /* input container */
        .input-box {
            position: relative;
            width: 100%;
        }

        /* corner decorations */
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: rgba(168, 85, 247, .7);
            border-style: solid;
            pointer-events: none;
            z-index: 2;
        }

        .corner.tl {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .corner.tr {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0;
        }

        .corner.bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
        }

        .corner.br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .secret-input {
            width: 100%;
            background: rgba(6, 0, 18, .75);
            border: 1.5px solid rgba(168, 85, 247, .3);
            border-radius: 10px;
            color: #e0c4ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: .9rem;
            letter-spacing: .25em;
            padding: 13px 18px;
            outline: none;
            caret-color: var(--glow);
            transition: border-color .25s, box-shadow .25s;
            animation: borderFlicker 7s infinite;
        }

        .secret-input::placeholder {
            color: rgba(168, 85, 247, .3);
            letter-spacing: .15em;
        }

        .secret-input:focus {
            border-color: rgba(168, 85, 247, .85);
            box-shadow: 0 0 24px rgba(168, 85, 247, .35), inset 0 0 16px rgba(168, 85, 247, .07);
            animation: borderFocusGlitch 4s infinite;
        }

        @keyframes borderFlicker {

            0%,
            93%,
            95%,
            97%,
            100% {
                border-color: rgba(168, 85, 247, .3);
            }

            94% {
                border-color: rgba(168, 85, 247, .85);
                box-shadow: 0 0 18px rgba(168, 85, 247, .5);
            }

            96% {
                border-color: rgba(168, 85, 247, .1);
            }
        }

        @keyframes borderFocusGlitch {

            0%,
            88%,
            90%,
            100% {
                border-color: rgba(168, 85, 247, .85);
            }

            89% {
                border-color: #f43f5e;
                box-shadow: 0 0 20px rgba(244, 63, 94, .4);
            }
        }

        /* scanlines overlay on input */
        .input-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent, transparent 2px,
                    rgba(0, 0, 0, .12) 2px, rgba(0, 0, 0, .12) 4px);
            border-radius: 10px;
            pointer-events: none;
            z-index: 1;
        }

        /* status line */
        .input-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: .55rem;
            letter-spacing: .18em;
            color: rgba(168, 85, 247, .5);
            align-self: flex-start;
            animation: statusCycle 3s steps(1) infinite;
        }

        @keyframes statusCycle {
            0% {
                content: '';
            }
        }

        /* cursor blink via ::after on the span */
        .cursor-blink {
            display: inline-block;
            width: 7px;
            height: .65em;
            background: rgba(168, 85, 247, .7);
            margin-left: 3px;
            vertical-align: middle;
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes cursorBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* ── SHARDS ── */
        #shardLayer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        /* ── PHOTO OVERLAY ── */
        .photo-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            background: rgba(5, 0, 15, 0);
            transition: opacity .5s ease, background .5s ease;
        }

        .photo-overlay.visible {
            opacity: 1;
            pointer-events: all;
            background: rgba(5, 0, 15, .9);
            backdrop-filter: blur(16px);
        }

        .photo-card {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(168, 85, 247, .55), 0 30px 80px rgba(0, 0, 0, .8);
            border: 2px solid rgba(168, 85, 247, .4);
            max-width: min(90vw, 700px);
            max-height: 80vh;
            transform: scale(.65) translateY(60px);
            transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
        }

        .photo-overlay.visible .photo-card {
            transform: scale(1) translateY(0);
        }

        .photo-card img {
            display: block;
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        .btn-again {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 22px;
            font-family: 'Unbounded', sans-serif;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .08em;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(168, 85, 247, .55);
            transition: transform .2s, box-shadow .2s;
        }

        .btn-again:hover {
            transform: scale(1.08);
            box-shadow: 0 0 38px rgba(168, 85, 247, .9);
        }

        /* ── CONFETTI ── */
        #confettiWrap {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }

        .cp {
            position: absolute;
            top: -30px;
            opacity: 0;
            animation: fall var(--fd, 1.2s) var(--fd2, 0s) ease-in forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0) scaleX(1);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg) scaleX(.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="stars"></div>
    <div id="flash"></div>

    <div class="scene-wrap" id="sceneWrap">
        <div class="title" id="title">Нажми на кубик</div>

        <div class="scene" id="scene">
            <div class="cube idle" id="cube">
                <!-- front=1 -->
                <div class="face front">
                    <div class="dot"></div>
                </div>
                <!-- back=6  -->
                <div class="face back">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <!-- right=3 -->
                <div class="face right">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <!-- left=4  -->
                <div class="face left">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <!-- top=5   -->
                <div class="face top">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <!-- bottom=2-->
                <div class="face bottom">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div id="cubeShadow"></div>
        <div class="hint" id="hint">кликни чтобы бросить</div>

        <!-- SECRET CODE -->
        <div class="secret-section">
            <div class="glitch-label-wrap">
                <div class="lock-dot"></div>
                <span class="glitch-label" data-text="Секретный код">Секретный код</span>
                <div class="lock-dot"></div>
            </div>
            <div class="input-box">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <input type="password" id="secretCode" class="secret-input" placeholder="••••••••" autocomplete="off"
                    spellcheck="false" />
            </div>
            <div class="input-status" id="inputStatus">
                // ОЖИДАНИЕ ВВОДА<span class="cursor-blink"></span>
            </div>
        </div>
    </div>

    <div id="shardLayer"></div>

    <div class="photo-overlay" id="photoOverlay">
        <div class="photo-card">
            <img id="photoImg" src="" alt="фото" />
            <button class="btn-again" id="btnAgain">🎲 Ещё раз</button>
        </div>
    </div>

    <div id="confettiWrap"></div>

    <script>
        // ── STARS ────────────────────────────────────────────────────
        (function () {
            const c = document.getElementById('stars');
            for (let i = 0; i < 130; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const sz = Math.random() * 2.4 + .5;
                s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${(Math.random() * 3 + 2).toFixed(1)}s;--oa:${(Math.random() * .1 + .03).toFixed(2)};--ob:${(Math.random() * .55 + .2).toFixed(2)};animation-delay:${(Math.random() * 5).toFixed(1)}s`;
                c.appendChild(s);
            }
        })();

        // ── INPUT STATUS CYCLING ────────────────────────────────────
        const STATUS_MSGS = [
            '// ОЖИДАНИЕ ВВОДА',
            '// СКАНИРОВАНИЕ...',
            '// ДОСТУП ЗАКРЫТ',
            '// ВВЕДИТЕ КОД',
            '// SISTEM32_READY',
        ];
        let statusIdx = 0;
        setInterval(() => {
            statusIdx = (statusIdx + 1) % STATUS_MSGS.length;
            const el = document.getElementById('inputStatus');
            el.innerHTML = STATUS_MSGS[statusIdx] + '<span class="cursor-blink"></span>';
        }, 2800);

        document.getElementById('secretCode').addEventListener('focus', () => {
            document.getElementById('inputStatus').innerHTML =
                '// ВВОД АКТИВИРОВАН<span class="cursor-blink"></span>';
        });
        document.getElementById('secretCode').addEventListener('blur', () => {
            document.getElementById('inputStatus').innerHTML =
                '// ОЖИДАНИЕ ВВОДА<span class="cursor-blink"></span>';
        });

        // ── PHOTOS ──────────────────────────────────────────────────
        const PHOTOS = [
            '2.webp',
            '81d775fb-886b-499b-85ef-46f11ebe5d4d.jpeg',
            'ac7d2d90-8971-452f-9895-5ce33d958eba.jpeg',
            'dec2e077-f2b0-4cee-a5aa-d98954dd9f7e.jpeg',
            'skibidi.png',
            'zhirnost.png',
        ];
        let lastPhotoIdx = -1;
        function randomPhoto() {
            let idx;
            do { idx = 0 | Math.random() * PHOTOS.length; } while (idx === lastPhotoIdx && PHOTOS.length > 1);
            lastPhotoIdx = idx;
            return PHOTOS[idx];
        }

        // ── FACE DATA ───────────────────────────────────────────────
        // (baseRx, baseRy) = final cube rotation to face that side toward camera
        const FACE_DATA = [
            { value: 1, baseRx: 0, baseRy: 0 },
            { value: 6, baseRx: 0, baseRy: 180 },
            { value: 3, baseRx: 0, baseRy: 270 },
            { value: 4, baseRx: 0, baseRy: 90 },
            { value: 5, baseRx: 270, baseRy: 0 },
            { value: 2, baseRx: 90, baseRy: 0 },
        ];
        let lastFaceIdx = -1;

        function rand(a, b) { return a + Math.random() * (b - a); }

        // ── SPIN ─────────────────────────────────────────────────────
        let isSpinning = false;

        function spinDice(onFinish) {
            const cube = document.getElementById('cube');

            // pick random face different from last
            let fi;
            do { fi = 0 | Math.random() * 6; } while (fi === lastFaceIdx);
            lastFaceIdx = fi;
            const face = FACE_DATA[fi];

            // 3–5 full spins per axis
            const spinsX = (3 + (0 | Math.random() * 3)) * 360;
            const spinsY = (3 + (0 | Math.random() * 3)) * 360;
            const finalRx = spinsX + face.baseRx;
            const finalRy = spinsY + face.baseRy;

            function midT(frac) {
                return `rotateX(${(finalRx * frac + rand(-45, 45)).toFixed(1)}deg) rotateY(${(finalRy * frac + rand(-45, 45)).toFixed(1)}deg)`;
            }

            const anim = cube.animate([
                { transform: 'rotateX(0deg) rotateY(0deg)', offset: 0 },
                { transform: midT(0.22), offset: 0.22 },
                { transform: midT(0.48), offset: 0.48 },
                { transform: midT(0.70), offset: 0.70 },
                { transform: midT(0.88), offset: 0.88 },
                { transform: midT(0.96), offset: 0.96 },
                { transform: `rotateX(${finalRx}deg) rotateY(${finalRy}deg)`, offset: 1 },
            ], {
                duration: 1750,
                easing: 'cubic-bezier(0.1, 0.55, 0.22, 1)',
                fill: 'forwards',
            });

            anim.onfinish = () => onFinish(face.value);
        }

        // ── FLASH ────────────────────────────────────────────────────
        function flashBoom() {
            const f = document.getElementById('flash');
            f.style.transition = 'none';
            f.style.opacity = '0.9';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                f.style.transition = 'opacity 0.45s ease-out';
                f.style.opacity = '0';
            }));
        }

        // ── SHATTER ──────────────────────────────────────────────────
        function shatter(callback) {
            const cube = document.getElementById('cube');
            const layer = document.getElementById('shardLayer');
            const scene = document.getElementById('scene');
            const rect = scene.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            cube.style.opacity = '0';
            document.getElementById('cubeShadow').style.opacity = '0';
            flashBoom();

            const cols = ['#a855f7', '#7c3aed', '#2a1060', '#1e0a4a', '#c084fc', '#e0c4ff', '#6d28d9', '#ddd6fe', '#110830'];

            for (let i = 0; i < 24; i++) {
                const sh = document.createElement('div');
                const sz = rand(13, 44);
                const sx = cx + rand(-70, 70);
                const sy = cy + rand(-70, 70);
                const angle = rand(0, Math.PI * 2);
                const dist = rand(80, 380);
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const rot = rand(200, 900);
                const col = cols[0 | Math.random() * cols.length];
                const circle = Math.random() > .3;

                sh.style.cssText = `
      position:fixed;left:${sx - sz / 2}px;top:${sy - sz / 2}px;
      width:${sz}px;height:${sz}px;
      background:${circle
                        ? `radial-gradient(circle at 35% 35%,#dcd0ff,${col})`
                        : `linear-gradient(${rand(0, 360).toFixed(0)}deg,${col},#0c0520)`};
      border:1.5px solid rgba(200,160,255,.55);
      border-radius:${circle ? '50%' : rand(2, 9).toFixed(0) + 'px'};
      box-shadow:0 0 12px rgba(168,85,247,.65);
      z-index:100;pointer-events:none;
      transform:rotate(0deg) scale(1);
      transition:transform .78s cubic-bezier(.15,0,.8,1),opacity .78s ease-out;
      opacity:1;
    `;
                layer.appendChild(sh);
                sh.getBoundingClientRect(); // reflow
                sh.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(0.06)`;
                sh.style.opacity = '0';
            }

            setTimeout(() => { layer.innerHTML = ''; callback(); }, 860);
        }

        // ── CONFETTI ─────────────────────────────────────────────────
        const CC = ['#a855f7', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#f43f5e', '#fff', '#fde68a'];
        function confetti() {
            const w = document.getElementById('confettiWrap');
            w.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const p = document.createElement('div');
                p.className = 'cp';
                const sz = rand(5, 16);
                p.style.cssText = `left:${rand(0, 100).toFixed(1)}%;width:${sz}px;height:${sz}px;background:${CC[0 | Math.random() * CC.length]};border-radius:${Math.random() > .5 ? '50%' : '3px'};--fd:${rand(.8, 2.2).toFixed(2)}s;--fd2:${rand(0, .8).toFixed(2)}s`;
                w.appendChild(p);
            }
        }

        // ── ROLL SEQUENCE ────────────────────────────────────────────
        function rollSequence() {
            if (isSpinning) return;
            isSpinning = true;

            const cube = document.getElementById('cube');
            const title = document.getElementById('title');
            const hint = document.getElementById('hint');

            // cancel idle, restore opacity
            cube.classList.remove('idle');
            cube.getAnimations().forEach(a => a.cancel());
            cube.style.opacity = '1';
            document.getElementById('cubeShadow').style.opacity = '1';

            title.className = 'title';
            title.textContent = 'Бросаю кубик…';
            hint.style.opacity = '0';

            spinDice((value) => {
                title.classList.add('landed');
                title.textContent = `Выпало ${value}! 🎲`;

                setTimeout(() => {
                    shatter(() => {
                        title.textContent = '';
                        // show photo
                        document.getElementById('photoImg').src = randomPhoto();
                        document.getElementById('photoOverlay').classList.add('visible');
                        confetti();
                        isSpinning = false;
                    });
                }, 320);
            });
        }

        // ── RESET ────────────────────────────────────────────────────
        function reset() {
            document.getElementById('photoOverlay').classList.remove('visible');
            document.getElementById('confettiWrap').innerHTML = '';
            document.getElementById('shardLayer').innerHTML = '';
            document.getElementById('title').className = 'title';
            document.getElementById('title').textContent = 'Нажми на кубик';
            document.getElementById('hint').style.opacity = '1';

            // restore cube idle
            const cube = document.getElementById('cube');
            cube.getAnimations().forEach(a => a.cancel());
            cube.style.opacity = '1';
            document.getElementById('cubeShadow').style.opacity = '1';
            cube.classList.add('idle');

            isSpinning = false;
        }

        // ── EVENTS ───────────────────────────────────────────────────
        document.getElementById('scene').addEventListener('click', rollSequence);
        document.getElementById('btnAgain').addEventListener('click', (e) => { e.stopPropagation(); reset(); });
        document.getElementById('photoOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) reset();
        });
        // block secret input from triggering scene click
        document.querySelector('.secret-section').addEventListener('click', e => e.stopPropagation());
    </script>
</body>

</html>
